name: CI

# Trigger -> permissions -> unit -> ranh giới tin cậy -> environment -> assume role -> Pulumi preview.
#
# - `unit` chạy ở mọi PR (kể cả fork, không credentials), merge_group và push vào main.
#   Giữ tên job ổn định là `unit` để dùng làm required check; KHÔNG dùng path filter ở cấp workflow,
#   vì check không xuất hiện thì required check treo mãi.
# - `preview` chỉ chạy với PR cùng repo (code đã được chủ repo đưa vào) và chỉ sau khi `unit` xanh,
#   nên code lỗi test không bao giờ nhận credentials. Nó dùng environment `preview` (role chỉ đọc `lab-preview`).
#   Preview của PR được phép có diff: nhiệm vụ của nó là cho reviewer xem thay đổi, nên không `expect-no-changes`.
#
# Chưa dùng `pull_request_target` và sẽ không dùng để checkout code PR rồi lấy secrets.
# Action được ghim bằng commit SHA đầy đủ; version ghi ở comment bên cạnh.
on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      # Worker: code Pulumi của ứng dụng.
      - name: worker - install
        working-directory: infra/worker
        run: npm ci
      - name: worker - typecheck
        working-directory: infra/worker
        run: npm run typecheck
      - name: worker - test
        working-directory: infra/worker
        run: npm test
      - name: worker - build handler
        working-directory: infra/worker
        run: npm run build:handler

      # Bootstrap: policy của role CI là hàm thuần có test; sửa sai ở đây là sai quyền AWS nên chạy cùng `unit`.
      - name: bootstrap - install
        working-directory: infra/bootstrap
        run: npm ci
      - name: bootstrap - typecheck
        working-directory: infra/bootstrap
        run: npm run typecheck
      - name: bootstrap - test
        working-directory: infra/bootstrap
        run: npm test

      # Scripts: vòng đời PR environment và reaper. Logic quyết định xoá là hàm thuần có test; sửa sai ở đây là xoá nhầm hạ tầng.
      - name: scripts - install
        working-directory: scripts
        run: npm ci
      - name: scripts - typecheck
        working-directory: scripts
        run: npm run typecheck
      - name: scripts - test
        working-directory: scripts
        run: npm test

      # Config: project platform-config (SSM parameter dùng chung); worker đọc output của nó qua StackReference.
      # Test dùng mocks của Pulumi, không gọi AWS.
      - name: config - install
        working-directory: infra/config
        run: npm ci
      - name: config - typecheck
        working-directory: infra/config
        run: npm run typecheck
      - name: config - test
        working-directory: infra/config
        run: npm test

      # Deploy CLI: quyết định có preview/apply/check hay không và exit code CI sẽ thấy. Test dùng adapter giả (không gọi
      # Pulumi hay AWS); vài test chạy CLI như process thật nhưng chỉ với ca lỗi TRƯỚC khi chạm Pulumi, và xoá PULUMI_ORG
      # khỏi môi trường của process con.
      - name: deploy-cli - install
        working-directory: tools/deploy-cli
        run: npm ci
      - name: deploy-cli - typecheck
        working-directory: tools/deploy-cli
        run: npm run typecheck
      - name: deploy-cli - test
        working-directory: tools/deploy-cli
        run: npm test

  preview:
    name: preview
    needs: unit
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: preview
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: preview-worker-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: worker - install
        working-directory: infra/worker
        run: npm ci
      # Pulumi đọc ./dist khi chạy chương trình: phải build handler trước preview.
      - name: worker - build handler
        working-directory: infra/worker
        run: npm run build:handler
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ secrets.AWS_ACCOUNT_ID }}
          role-session-name: lab-preview-${{ github.run_id }}
      - name: Danh tính AWS
        run: aws sts get-caller-identity
      # Pulumi Cloud xác thực riêng, cũng bằng OIDC: đổi token của GitHub lấy một Pulumi access token
      # ngắn hạn, không có secret tĩnh nào trong GitHub. Cần issuer GitHub + policy (aud, sub của environment
      # `preview`) đã đăng ký ở Pulumi Cloud, xem docs/ci-access.md. Action xuất PULUMI_ACCESS_TOKEN cho bước sau
      # (đã mask); vì vậy bước Pulumi bên dưới KHÔNG được tự đặt PULUMI_ACCESS_TOKEN.
      - uses: pulumi/auth-actions@273044cc19e63ea565285da8edd4e059126a0bdb # v2.1.2
        with:
          organization: ${{ vars.PULUMI_ORG }}
          requested-token-type: urn:pulumi:token-type:access_token:personal
          scope: user:${{ vars.PULUMI_USER }}
          token-expiration: 1800
      # `defaults.run.working-directory` chỉ áp dụng cho `run`; action của Pulumi cần `work-dir` riêng.
      - uses: pulumi/actions@96c7761824268174e0d2a4e8c7d75671eebd24a7 # v7.1.0
        with:
          command: preview
          stack-name: ${{ vars.PULUMI_STACK_DEV }}
          work-dir: infra/worker
          pulumi-version: '3.274.1'
          diff: true
          refresh: true
          comment-on-pr: false

  # PR environment: mỗi PR cùng repo có đúng một stack `pr-<số PR>` (SQS + DLQ + Lambda + log group; không ALB/NAT).
  # - `needs: unit`: code lỗi test không bao giờ nhận credentials (cùng nguyên tắc với `preview`).
  # - Chỉ PR cùng repo: PR từ fork không được cấp credentials. Job này CHẠY CODE CỦA PR với role `lab-pr-env`,
  #   nên ranh giới tin cậy là quyền ghi vào repo (xem docs/ci-access.md).
  # - Số PR đến từ sự kiện qua biến môi trường, được script kiểm tra là số nguyên dương; không dùng tiêu đề/nội dung PR.
  # - Concurrency group `pr-platform-worker-<số PR>` dùng chung với workflow dọn dẹp (pr-env-destroy.yml): up và destroy
  #   của cùng một PR không bao giờ chạy chồng. cancel-in-progress false vì huỷ giữa lúc `up` có thể để thao tác dở.
  # Môi trường dọn sau khi PR đóng (pr-env-destroy.yml) hoặc khi TTL 24 giờ hết (pr-env-reaper.yml).
  pr-env:
    name: pr-env
    needs: unit
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: pr-env
    permissions:
      contents: read
      id-token: write
      pull-requests: read
    concurrency:
      group: pr-platform-worker-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PULUMI_ORG: ${{ vars.PULUMI_ORG }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      # Không có `command` thì pulumi/actions chỉ cài CLI rồi thoát (script gọi `pulumi` trực tiếp).
      - name: install Pulumi CLI
        uses: pulumi/actions@96c7761824268174e0d2a4e8c7d75671eebd24a7 # v7.1.0
        with:
          pulumi-version: '3.274.1'
      - name: worker - install
        working-directory: infra/worker
        run: npm ci
      - name: worker - build handler
        working-directory: infra/worker
        run: npm run build:handler
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ secrets.AWS_ACCOUNT_ID }}
          role-session-name: lab-pr-env-${{ github.run_id }}
      - uses: pulumi/auth-actions@273044cc19e63ea565285da8edd4e059126a0bdb # v2.1.2
        with:
          organization: ${{ vars.PULUMI_ORG }}
          requested-token-type: urn:pulumi:token-type:access_token:personal
          scope: user:${{ vars.PULUMI_USER }}
          token-expiration: 3000
      - name: pr-env up
        run: node scripts/pr-env.ts up --pr "${PR_NUMBER}"
